<svg width="1600" height="700" viewBox="0 0 1600 700"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- LIGHT BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6f8"/>
    </linearGradient>

    <!-- CYAN GLOW -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- GRID -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#cbd5e1"
            stroke-width="1"
            opacity="0.35"/>

    </pattern>

    <!-- SOFT DOT PATTERN -->
    <pattern id="dots"
             width="24"
             height="24"
             patternUnits="userSpaceOnUse">

      <circle cx="2"
              cy="2"
              r="1"
              fill="#94a3b8"
              opacity="0.15"/>

    </pattern>

  </defs>


