  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1600"
        height="700"
        fill="url(#bg)"/>

  <rect width="1600"
        height="700"
        fill="url(#grid)"/>

  <rect width="1600"
        height="700"
        fill="url(#dots)"/>


