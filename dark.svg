<svg width="1600" height="700" viewBox="0 0 1600 700"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cyan glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Small cyan glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#1e293b"
            stroke-width="1"
            opacity="0.35"/>
    </pattern>

    <!-- Scanline pattern -->
    <pattern id="scanlines"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">
      <rect width="4" height="2"
            fill="#ffffff"
            opacity="0.015"/>
    </pattern>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1600"
        height="700"
        fill="url(#bg)"/>

  <rect width="1600"
        height="700"
        fill="url(#grid)"/>

  <rect width="1600"
        height="700"
        fill="url(#scanlines)"/>


  <!-- Cyan ambient glow -->

